# ==========================================
# 0. Configuracion General y Spring Cloud
# ==========================================
spring.application.name=pago-de-servicios
server.port=8080
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# ==========================================
# 1. Configuracion de PostgreSQL (Contenedor en Puerto 5434)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5434/pago_de_servicios
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# ==========================================
# 2. Configuracion de MongoDB (Catalogo y Logs XML)
# ==========================================
spring.data.mongodb.uri=mongodb://localhost:27017/pago_de_servicios

# ==========================================
# 3. Configuracion de GestoPago (Autenticacion)
# ==========================================
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.refresh-rate-ms=3600000

# ==========================================
# 4. Configuracion de GestoPago (Catalogo de Productos)
# ==========================================
gestopago.products.url=https://gestopago.portalventas.net
gestopago.products.cron=0 0 6 * * ?
gestopago.products.connect-timeout=10000
gestopago.products.read-timeout=62000
