# ==========================================
# 0. Configuracion General y Spring Cloud
# ==========================================
spring.application.name=pago-de-servicios
server.port=${PORT:8080}
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.config.import=optional:configserver:

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# ==========================================
# 1. Configuracion de PostgreSQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/pago_de_servicios}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# ==========================================
# 2. Configuracion de MongoDB (Catalogo y Logs XML)
# ==========================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/pago_de_servicios}

# ==========================================
# 3. Configuracion de GestoPago (Autenticacion)
# ==========================================
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# ==========================================
# 4. Configuracion de GestoPago (Catalogo de Productos)
# ==========================================
gestopago.products.url=${GESTOPAGO_PRODUCTS_URL:https://gestopago.portalventas.net}
gestopago.products.cron=0 0 6 * * ?
gestopago.products.connect-timeout=10000
gestopago.products.read-timeout=62000

# ==========================================
# 5. Configuracion de GestoPago (Transacciones sendTx / confirmTx y AES)
# ==========================================
gestopago.tx.url=${GESTOPAGO_TX_URL:https://gestopago.portalventas.net}
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:083}
gestopago.tx.api-key=${GESTOPAGO_API_KEY:YSX1HpAFum4TpCecyFBxs4eIjAlbhKqK6fpcSQp8}
gestopago.tx.aes-secret-key=${GESTOPAGO_AES_SECRET_KEY:HPo7OLqB4Fkk4E2yGOtwqw8H5fHR9kNx67OR4g4UdlA=}
gestopago.tx.aes-iv=${GESTOPAGO_AES_IV:p5ldmBPdd/9pjC0bDC/nSg==}

# ==========================================
# 6. Configuracion de API de Direcciones (SEPOMEX)
# ==========================================
sepomex.api.url=${SEPOMEX_API_URL:http://api.zippopotam.us}
